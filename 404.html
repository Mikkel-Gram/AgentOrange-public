    <base href="/" />
    <script>
        // GitHub Pages SPA fallback, part two. 404.html stashed the original deep link and
        // bounced us to the app root; put the real URL back before anything reads it.
        //
        // Ordering is load-bearing in both directions. It must run AFTER <base> is parsed,
        // because the browser freezes the base URL when it sees that element -- rewriting
        // history first would freeze the base against the deep link and every framework asset
        // would 404. It must run BEFORE blazor.webassembly.js, so the router's first read of
        // the URL is the deep link rather than the root.
        (function () {
            var redirect = sessionStorage.getItem('spa-redirect');
            if (redirect) {
                sessionStorage.removeItem('spa-redirect');
                history.replaceState(null, '', redirect);
            }
        })();
    </script>

    <script>
        // Cognito has no end_session_endpoint: logout clears the oidc-client session stored by
        // AuthenticationService.js and then redirects to Cognito's /logout endpoint (see CognitoLogoutService).
        window.agentOrange = {
            clearOidcSession: function () {
                for (const storage of [window.sessionStorage, window.localStorage]) {
                    const keys = [];
                    for (let i = 0; i < storage.length; i++) {
                        const key = storage.key(i);
                        if (key && key.startsWith("oidc.")) {
                            keys.push(key);
                        }
                    }
                    keys.forEach(k => storage.removeItem(k));
                }
            }
        };
    </script>
